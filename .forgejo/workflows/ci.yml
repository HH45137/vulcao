name: ci

# Forgejo Actions (Codeberg). Mirrors .github/workflows/ci.yml, but:
# - Windows is not covered here.
# - The Vulkan loader, validation layers and lavapipe are installed from apt.
#   Samples are disabled, so no shader compiler is needed.
# - Adjust runs-on to match your runner's label (e.g. "docker" or a custom one).

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers

      - name: Configure lavapipe
        run: |
          ls -la /usr/share/vulkan/icd.d/
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)"
          if [ -z "$icd" ]; then
            echo "lavapipe ICD not found" >&2
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -DVULCAO_BUILD_SAMPLES=OFF -DVULCAO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test (lavapipe, validation)
        run: ctest --test-dir build --output-on-failure -C Release
