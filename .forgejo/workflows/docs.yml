name: docs

# Builds the Doxygen documentation and publishes it to Codeberg Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Doxygen 1.16.1 and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz curl
          curl -sSL -o doxygen.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_16_1/doxygen-1.16.1.linux.bin.tar.gz
          tar -xzf doxygen.tar.gz

      - name: Generate
        run: |
          export LD_LIBRARY_PATH="$PWD/doxygen-1.16.1/lib"
          ./doxygen-1.16.1/bin/doxygen docs/Doxyfile

      - name: Publish to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/vulcao/
          token: ${{ forge.token }}
          source: docs/generated/html
