name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Vulkan (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers

      - name: Configure lavapipe
        if: runner.os == 'Linux'
        run: |
          ls -la /usr/share/vulkan/icd.d/
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)"
          if [ -z "$icd" ]; then
            echo "lavapipe ICD not found" >&2
            exit 1
          fi
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true

      - name: Configure
        run: cmake -S . -B build -DVULCAO_BUILD_SAMPLES=OFF -DVULCAO_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        if: runner.os != 'Linux'
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Test (lavapipe, validation)
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure -C Release
